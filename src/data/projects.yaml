# Projects listed on /work. Order here is display order.
#   section: hack-club → the Hack Club list (left column); personal → Personal Projects (right);
#            older → the "Older Projects" group on /projects only
#   featured: personal projects also listed on /work (/projects lists every personal project)
#   title:   role on the project, shown under the name (from the resume)
#   links:   Hack Club projects: small links under the title, shown as "Github • Website • HCB"
#            (keys github / website / hcb get those labels; any other key is capitalised)
#   href:    personal projects: the name itself links here
#   logo:    a mark in src/pages/work.astro's logo map (SVG or alpha PNG in src/assets/work or src/assets/figma)
#   color:   hover accent for the entry (name, mark, tags, sublinks)
#   overlay: component in src/components/overlays shown while the entry is hovered
