# Projects. Order here is display order.
#   cover:   /work shows every entry with a cover, as a card: src/assets/covers/<cover>.webp
#            (3x renders of the Figma covers, section node 2481:697)
#   heading: the card's title (defaults to name)
#   tags:    pills (no longer shown on /work, which has `subtitle` instead)
#   subtitle: the card's italic line under the title
#   blurb:   the card's text; a blank line starts a new paragraph
#   section: personal → listed on /projects; older → its "Older Projects" group
#   name, time, href: how /projects lists an entry (the name links to href)
#   links:   website → where the card links (else href); every link shows at the card's foot
#            (portfolio → its writeup on portfolio.manitej.com/work/<id>, where one exists)
#   title:   role on the project, from the resume (not shown at the moment)

- id: horizons
  name: Horizons
  time: HC 2026
  title: Lead UI/UX Designer & Engineer
  links:
    github: https://github.com/hackclub/horizons
    website: https://horizons.hackclub.com
    portfolio: https://portfolio.manitej.com/work/horizons
    hcb: https://hcb.hackclub.com/horizons
  heading: Hack Club Horizons
  subtitle: Hack Club Gap Year Project (2026)
  cover: horizons
  tags: [Lead, Product, Branding, UI/UX, Engineering]
  blurb: >-
    Horizons was a series of 6 hackathons around the world in San Francisco, Sydney, Berlin,
    Singapore, Toronto, and Cairo! We had 50 organizers and 350 attendees across all events. 650
    teens worked for over 23,000 hours on over 1,700 approved technical projects as a part of
    Horizons.

